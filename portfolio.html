<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Portfolio — Mega Traders</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="app.css">
<style>
    .total-card {
        background: linear-gradient(160deg, #1c1c1c, #161616);
        border-radius: var(--radius);
        padding: 26px 24px;
        display: flex;
        flex-direction: column;
        gap: 6px;
    }
    .total-card .label {
        font-size: 12px;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-weight: 700;
    }
    .total-card .value {
        font-size: 36px;
        font-weight: 800;
        letter-spacing: -0.03em;
    }
    .total-card .value .currency {
        font-size: 15px;
        font-weight: 600;
        color: var(--text-muted);
        margin-left: 6px;
    }
    .total-card .sub {
        font-size: 13px;
        color: var(--text-muted);
        margin-top: 4px;
    }

    .alloc-list {
        display: grid;
        gap: 14px;
        background-color: var(--bg-elevated);
        border-radius: var(--radius);
        padding: 20px;
    }
    .alloc-row {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }
    .alloc-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 13px;
        color: var(--text-main);
        font-weight: 600;
    }
    .alloc-head .pct { color: var(--text-muted); font-weight: 500; }
    .alloc-bar {
        height: 6px;
        border-radius: 999px;
        background-color: #333;
        overflow: hidden;
    }
    .alloc-bar span {
        display: block;
        height: 100%;
        border-radius: 999px;
        background-color: var(--brand-red);
    }
</style>
</head>
<body>
<div class="app">

    <header class="top-bar">
        <a href="index.html" class="avatar">KB</a>
        <button class="ask-amy"><span class="sparkle">✦</span> Ask Amy</button>
        <div class="top-actions">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
            </svg>
            <div class="icon-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
                    <path d="M13.7 21a2 2 0 0 1-3.4 0"/>
                </svg>
                <span class="notif-badge">1</span>
            </div>
        </div>
    </header>

    <main class="content">

        <section>
            <h2 class="section-title">Total portfolio value</h2>
            <div class="total-card">
                <span class="label">Net worth</span>
                <div class="value">0.00 <span class="currency">USD</span></div>
                <span class="sub">Across all accounts</span>
            </div>
        </section>

        <section>
            <h2 class="section-title">Allocation</h2>
            <div class="alloc-list">
                <div class="alloc-row">
                    <div class="alloc-head"><span>CFDs · Standard</span><span class="pct">0%</span></div>
                    <div class="alloc-bar"><span style="width: 0%;"></span></div>
                </div>
                <div class="alloc-row">
                    <div class="alloc-head"><span>Options</span><span class="pct">0%</span></div>
                    <div class="alloc-bar"><span style="width: 0%;"></span></div>
                </div>
            </div>
        </section>

        <section>
            <h2 class="section-title">Positions</h2>
            <div class="empty-state">
                <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                    <path d="M9 3v18"/>
                </svg>
                <p>No open positions yet.<br>Start trading to see your holdings here.</p>
            </div>
        </section>

    </main>

    <nav class="bottom-nav">
        <a class="nav-item" href="dashboard.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <path d="M9 22V12h6v10"/>
            </svg>
            Home
        </a>
        <a class="nav-item" href="cfds.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 3v18h18"/>
                <path d="m7 15 4-5 3 3 5-7"/>
            </svg>
            CFDs
        </a>
        <a class="nav-item" href="options.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="16" rx="2"/>
                <path d="M8 10h8M8 14h5"/>
            </svg>
            Options
        </a>
        <a class="nav-item active" href="portfolio.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <path d="M9 3v18"/>
            </svg>
            Portfolio
        </a>
    </nav>

</div>
</body>
</html>
