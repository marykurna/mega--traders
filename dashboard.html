<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mega Traders — Dashboard</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="app.css">
<style>
    .deposit-banner {
        background-color: var(--bg-elevated);
        border-radius: var(--radius);
        padding: 22px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
    }
    .deposit-text {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 14px;
    }
    .deposit-text h2 {
        font-size: 20px;
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.2;
    }
    .progress-track {
        width: 100%;
        max-width: 200px;
        height: 4px;
        background-color: #2e2e2e;
        border-radius: 999px;
        overflow: hidden;
    }
    .progress-fill {
        height: 100%;
        background-color: var(--accent-green);
        border-radius: 999px;
        transition: width 0.4s ease;
    }
    .banner-buttons {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
    }
    .btn-deposit {
        padding: 10px 22px;
        background-color: var(--brand-red);
        color: #ffffff;
        border-radius: 999px;
        font-size: 14px;
        font-weight: 700;
        transition: transform 0.2s ease, background-color 0.2s ease;
    }
    .btn-deposit:hover {
        background-color: var(--brand-red-dark);
        transform: translateY(-1px);
    }
    .btn-withdraw {
        padding: 10px 22px;
        background-color: transparent;
        color: var(--brand-red);
        border: 1px solid rgba(255, 68, 79, 0.5);
        border-radius: 999px;
        font-size: 14px;
        font-weight: 700;
        transition: transform 0.2s ease, background-color 0.2s ease, border-color 0.2s ease;
    }
    .btn-withdraw:hover {
        background-color: rgba(255, 68, 79, 0.1);
        border-color: var(--brand-red);
        transform: translateY(-1px);
    }
    .deposit-illustration { width: 90px; flex-shrink: 0; }

    .accounts-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
    }
    .account-card {
        background-color: var(--bg-elevated);
        border-radius: var(--radius);
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        transition: background-color 0.2s ease, transform 0.2s ease;
        cursor: pointer;
    }
    .account-card:hover {
        background-color: #2a2a2a;
        transform: translateY(-2px);
    }
    .account-icon {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background-color: var(--brand-red);
        color: #ffffff;
        font-size: 13px;
        font-weight: 900;
        letter-spacing: -0.02em;
        line-height: 1;
    }
    .account-icon svg { width: 20px; height: 20px; }
    .account-name {
        font-size: 14px;
        font-weight: 700;
        color: var(--text-main);
        line-height: 1.3;
    }
    .account-name span { color: var(--text-dim); font-weight: 500; }
    .account-balance {
        font-size: 15px;
        font-weight: 700;
        color: var(--text-main);
    }
    .account-balance .currency {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-muted);
        margin-left: 2px;
    }

    .promo-card {
        background-color: var(--bg-elevated);
        border-radius: var(--radius);
        padding: 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
    }
    .promo-content { flex: 1; display: flex; flex-direction: column; gap: 8px; }
    .promo-content h3 {
        font-size: 16px;
        font-weight: 800;
        letter-spacing: -0.01em;
        line-height: 1.25;
    }
    .promo-content p { font-size: 13px; color: var(--text-muted); line-height: 1.45; }
    .promo-logos { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .logo-deriv {
        width: 44px; height: 44px;
        border-radius: 12px;
        background-color: var(--brand-red);
        display: grid; place-items: center;
        color: #ffffff;
        font-size: 22px; font-weight: 900;
        letter-spacing: -0.04em;
    }
    .logo-tv {
        width: 44px; height: 44px;
        border-radius: 12px;
        background-color: #1a1a1a;
        border: 1px solid var(--border-color);
        display: grid; place-items: center;
        color: #ffffff;
        font-size: 11px; font-weight: 800;
        line-height: 1;
        text-align: center;
    }
    .logo-tv small { display: block; font-size: 8px; font-weight: 500; color: var(--text-dim); }

    .carousel-dots {
        display: flex;
        justify-content: center;
        gap: 6px;
        margin-top: 14px;
    }
    .carousel-dots span {
        width: 6px; height: 6px;
        border-radius: 50%;
        background-color: #3a3a3a;
    }
    .carousel-dots span.active {
        background-color: var(--text-main);
        width: 20px;
        border-radius: 999px;
    }
</style>
</head>
<body>

<div class="app">

    <header class="top-bar">
        <a href="settings.html" class="avatar" id="avatar">KB</a>
        <button class="ask-amy"><span class="sparkle">✦</span> Ask Amy</button>
        <div class="top-actions">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
            </svg>
            
                        <a href="history.html" style="color: inherit; display: grid; place-items: center;" aria-label="History">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 8v4l3 2"/>
                    <circle cx="12" cy="12" r="9"/>
                </svg>
            </a><div class="icon-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
                    <path d="M13.7 21a2 2 0 0 1-3.4 0"/>
                </svg>
                <span class="notif-badge">1</span>
            </div>
        </div>
    </header>

    <main class="content">

        <section class="deposit-banner">
            <div class="deposit-text">
                <h2 id="bannerTitle">Make your first deposit</h2>
                <div class="progress-track">
                    <div class="progress-fill" id="progressFill" style="width: 18%;"></div>
                </div>
                <div class="banner-buttons">
                    <a href="deposit.html" class="btn-deposit" id="depositBtn">Deposit now</a>
                    <a href="withdraw.html" class="btn-withdraw" id="withdrawBtn" style="display: none;">Withdraw</a>
                </div>
            </div>

            <div class="deposit-illustration">
                <svg viewBox="0 0 90 80" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M15 65 L75 65 L75 70 L15 70 Z" fill="#4a4a4a"/>
                    <path d="M15 15 L15 65 L20 65 L20 20 L75 20 L75 15 Z" fill="#4a4a4a"/>
                    <g fill="#ff444f">
                        <circle cx="38" cy="28" r="4"/>
                        <rect x="34" y="34" width="8" height="14" rx="3"/>
                        <circle cx="50" cy="24" r="4"/>
                        <rect x="46" y="30" width="8" height="18" rx="3"/>
                        <circle cx="62" cy="32" r="4"/>
                        <rect x="58" y="38" width="8" height="12" rx="3"/>
                    </g>
                </svg>
            </div>
        </section>

        <section>
            <h2 class="section-title">My trading accounts</h2>
            <div class="accounts-grid">

                <a href="cfds.html" class="account-card">
                    <div class="account-icon">MT5<br><small style="font-size:8px;font-weight:600;opacity:0.8;">STD</small></div>
                    <div class="account-name">CFDs <span>| Standard</span></div>
                    <div class="account-balance">
                        <span class="balance-value">0.00</span> <span class="currency">USD</span>
                    </div>
                </a>

                <a href="options.html" class="account-card">
                    <div class="account-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M7 17 17 7"/>
                            <path d="M7 7h10v10"/>
                        </svg>
                    </div>
                    <div class="account-name">Options</div>
                    <div class="account-balance">
                        <span class="balance-value">0.00</span> <span class="currency">USD</span>
                    </div>
                </a>

            </div>
        </section>

        <section>
            <div class="promo-card">
                <div class="promo-content">
                    <h3>Trade with TradingView charts</h3>
                    <p>Advanced charts and tools for 24/7 Derived Indices.</p>
                </div>
                <div class="promo-logos">
                    <div class="logo-deriv">d</div>
                    <div class="logo-tv">
                        <span>TV</span>
                        <small>TradingView</small>
                    </div>
                </div>
            </div>
            <div class="carousel-dots" aria-hidden="true">
                <span class="active"></span>
                <span></span>
                <span></span>
            </div>
        </section>

    </main>

    <nav class="bottom-nav">
        <a class="nav-item active" href="dashboard.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <path d="M9 22V12h6v10"/>
            </svg>
            Home
        </a>
        <a class="nav-item" href="cfds.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 3v18h18"/>
                <path d="m7 15 4-5 3 3 5-7"/>
            </svg>
            CFDs
        </a>
        <a class="nav-item" href="options.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="16" rx="2"/>
                <path d="M8 10h8M8 14h5"/>
            </svg>
            Options
        </a>
        <a class="nav-item" href="portfolio.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <path d="M9 3v18"/>
            </svg>
            Portfolio
        </a>
    </nav>

</div>

<script>
    // ---------- Avatar initial ----------
    try {
        const email = localStorage.getItem('mt_user_email');
        if (email) {
            const initial = email.charAt(0).toUpperCase();
            const avatar = document.getElementById('avatar');
            if (avatar) avatar.textContent = initial;
        }
    } catch (_) {}

    // ---------- Balance display ----------
    function getBalance() {
        try {
            return parseFloat(localStorage.getItem('mt_balance')) || 0;
        } catch (_) {
            return 0;
        }
    }

    function formatBalance(n) {
        return n.toLocaleString('en-US', {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });
    }

    const balance = getBalance();

    document.querySelectorAll('.balance-value').forEach(el => {
        el.textContent = formatBalance(balance);
    });

    const bannerTitle   = document.getElementById('bannerTitle');
    const depositBtn    = document.getElementById('depositBtn');
    const withdrawBtn   = document.getElementById('withdrawBtn');
    const progressFill  = document.getElementById('progressFill');

    if (balance > 0) {
        bannerTitle.textContent = 'Total deposited';
        depositBtn.textContent = 'Deposit more';
        withdrawBtn.style.display = 'inline-flex';
        const pct = Math.min(100, (balance / 1000) * 100);
        progressFill.style.width = pct + '%';
    } else {
        progressFill.style.width = '18%';
    }
</script>

</body>
</html>
