<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Deposit — Mega Traders</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="app.css">
<style>
    /* ---- Deposit-page-specific ---- */
    .deposit-header {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 18px 20px 8px;
    }
    .back-btn {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background-color: var(--bg-elevated);
        display: grid;
        place-items: center;
        color: var(--text-main);
        transition: background-color 0.2s ease;
    }
    .back-btn:hover { background-color: #2e2e2e; }
    .deposit-header h1 {
        font-size: 20px;
        font-weight: 800;
        letter-spacing: -0.01em;
    }

    /* ---- Amount input ---- */
    .amount-wrap {
        background-color: var(--bg-elevated);
        border-radius: var(--radius);
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
    }
    .amount-label {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-muted);
    }
    .amount-input-row {
        display: flex;
        align-items: baseline;
        gap: 8px;
    }
    .amount-input-row .currency {
        font-size: 26px;
        font-weight: 800;
        color: var(--text-muted);
    }
    .amount-input-row input {
        flex: 1;
        background: transparent;
        border: none;
        color: var(--text-main);
        font-size: 40px;
        font-weight: 800;
        letter-spacing: -0.03em;
        width: 100%;
        padding: 0;
        outline: none;
        font-variant-numeric: tabular-nums;
    }
    .amount-input-row input::placeholder { color: #3a3a3a; }

    .quick-amounts {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
    }
    .quick-btn {
        padding: 10px 0;
        border-radius: 10px;
        background-color: #2a2a2a;
        color: var(--text-main);
        font-size: 13px;
        font-weight: 700;
        transition: background-color 0.15s ease, color 0.15s ease;
    }
    .quick-btn:hover { background-color: #353535; }
    .quick-btn.active {
        background-color: rgba(255, 68, 79, 0.16);
        color: var(--brand-red);
    }

    /* ---- Payment methods ---- */
    .method-list {
        display: grid;
        gap: 10px;
    }
    .method-tile {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 16px 18px;
        background-color: var(--bg-elevated);
        border-radius: 14px;
        border: 1px solid transparent;
        cursor: pointer;
        transition: border-color 0.15s ease, background-color 0.15s ease;
    }
    .method-tile:hover { background-color: #2a2a2a; }
    .method-tile input { display: none; }
    .method-tile input:checked ~ .method-info .method-name { color: var(--brand-red); }
    .method-tile input:checked ~ .radio-mark {
        border-color: var(--brand-red);
        background-color: var(--brand-red);
    }
    .method-tile input:checked ~ .radio-mark::after { opacity: 1; }

    .method-icon {
        width: 40px;
        height: 40px;
        border-radius: 10px;
        background-color: #333;
        display: grid;
        place-items: center;
        color: var(--text-muted);
        flex-shrink: 0;
    }
    .method-info { flex: 1; }
    .method-name {
        font-size: 14px;
        font-weight: 700;
        color: var(--text-main);
        transition: color 0.15s ease;
    }
    .method-sub {
        font-size: 12px;
        color: var(--text-muted);
        margin-top: 2px;
    }
    .radio-mark {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        border: 2px solid #444;
        position: relative;
        flex-shrink: 0;
        transition: border-color 0.15s ease, background-color 0.15s ease;
    }
    .radio-mark::after {
        content: "";
        position: absolute;
        inset: 4px;
        border-radius: 50%;
        background-color: #fff;
        opacity: 0;
        transition: opacity 0.15s ease;
    }

    /* ---- Submit ---- */
    .submit-area {
        padding: 0 20px 20px;
    }
    .btn-submit {
        width: 100%;
        padding: 16px;
        border-radius: 14px;
        background-color: var(--brand-red);
        color: #fff;
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0.01em;
        transition: background-color 0.2s ease, transform 0.15s ease;
    }
    .btn-submit:hover {
        background-color: var(--brand-red-dark);
        transform: translateY(-1px);
    }
    .btn-submit:active { transform: translateY(0); }
    .btn-submit:disabled {
        background-color: #333;
        color: var(--text-dim);
        cursor: not-allowed;
        transform: none;
    }

    .toast {
        position: fixed;
        left: 50%;
        bottom: 100px;
        transform: translateX(-50%) translateY(20px);
        background-color: var(--accent-green);
        color: #0a0e12;
        padding: 12px 22px;
        border-radius: 999px;
        font-size: 14px;
        font-weight: 700;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease, transform 0.25s ease;
        z-index: 200;
    }
    .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
    }
</style>
</head>
<body>
<div class="app">

    <header class="deposit-header">
        <a href="dashboard.html" class="back-btn" aria-label="Back">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5"/><path d="m12 19-7-7 7-7"/>
            </svg>
        </a>
        <h1>Deposit</h1>
    </header>

    <main class="content">

        <section>
            <div class="amount-wrap">
                <span class="amount-label">Amount</span>
                <div class="amount-input-row">
                    <span class="currency">$</span>
                    <input type="number" id="amount" placeholder="0.00" min="1" step="0.01" inputmode="decimal">
                </div>
                <div class="quick-amounts">
                    <button type="button" class="quick-btn" data-amount="50">$50</button>
                    <button type="button" class="quick-btn" data-amount="100">$100</button>
                    <button type="button" class="quick-btn" data-amount="500">$500</button>
                    <button type="button" class="quick-btn" data-amount="1000">$1,000</button>
                </div>
            </div>
        </section>

        <section>
            <h2 class="section-title">Payment method</h2>
            <div class="method-list">

                <label class="method-tile">
                    <input type="radio" name="method" value="card" checked>
                    <span class="method-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="5" width="20" height="14" rx="3"/>
                            <path d="M2 10h20"/>
                        </svg>
                    </span>
                    <span class="method-info">
                        <span class="method-name">Debit / Credit card</span>
                        <span class="method-sub">Instant · Visa, Mastercard</span>
                    </span>
                    <span class="radio-mark"></span>
                </label>

                <label class="method-tile">
                    <input type="radio" name="method" value="crypto">
                    <span class="method-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="9"/>
                            <path d="M12 7v10M9 9h4a2 2 0 0 1 0 4H9h4a2 2 0 0 1 0 4H9"/>
                        </svg>
                    </span>
                    <span class="method-info">
                        <span class="method-name">Crypto</span>
                        <span class="method-sub">BTC, ETH, USDT · ~10 min</span>
                    </span>
                    <span class="radio-mark"></span>
                </label>

                <label class="method-tile">
                    <input type="radio" name="method" value="bank">
                    <span class="method-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6"/>
                        </svg>
                    </span>
                    <span class="method-info">
                        <span class="method-name">Bank transfer</span>
                        <span class="method-sub">1–3 business days · No fees</span>
                    </span>
                    <span class="radio-mark"></span>
                </label>

            </div>
        </section>

    </main>

    <div class="submit-area">
        <button class="btn-submit" id="submitBtn" disabled>Enter an amount</button>
    </div>

</div>

<div class="toast" id="toast">Deposit successful</div>

<script>
    const amountInput = document.getElementById('amount');
    const submitBtn   = document.getElementById('submitBtn');
    const quickBtns   = document.querySelectorAll('.quick-btn');
    const toast       = document.getElementById('toast');

    // ---------- Quick-pick buttons ----------
    quickBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            const val = btn.dataset.amount;
            amountInput.value = val;
            quickBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            updateSubmit();
        });
    });

    // ---------- Enable/disable submit ----------
    function updateSubmit() {
        const val = parseFloat(amountInput.value);
        if (!isNaN(val) && val > 0) {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Deposit $' + val.toLocaleString('en-US', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        } else {
            submitBtn.disabled = true;
            submitBtn.textContent = 'Enter an amount';
        }
    }

    amountInput.addEventListener('input', () => {
        quickBtns.forEach(b => b.classList.remove('active'));
        updateSubmit();
    });

    // ---------- Submit ----------
    submitBtn.addEventListener('click', () => {
        const val = parseFloat(amountInput.value);
        if (isNaN(val) || val <= 0) return;

        // Read existing balance, add to it, save
        let current = 0;
        try {
            current = parseFloat(localStorage.getItem('mt_balance')) || 0;
        } catch (_) {}
        const newBalance = current + val;
        try {
            localStorage.setItem('mt_balance', String(newBalance));
        } catch (_) {}

        // Show toast, then redirect
        toast.textContent = 'Deposited $' + val.toLocaleString('en-US', {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });
        toast.classList.add('show');

        setTimeout(() => {
            window.location.href = 'dashboard.html';
        }, 900);
    });

    updateSubmit();
</script>

</body>
</html>
