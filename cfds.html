<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CFDs — Mega Traders</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="app.css">
<style>
    /* Page-specific tweaks only */
    .account-hero {
        background: linear-gradient(160deg, #1c1c1c, #161616);
        border-radius: var(--radius);
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 14px;
    }
    .account-hero .label {
        font-size: 12px;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-weight: 700;
    }
    .account-hero .value {
        font-size: 32px;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: var(--text-main);
    }
    .account-hero .value .currency {
        font-size: 14px;
        font-weight: 600;
        color: var(--text-muted);
        margin-left: 6px;
    }
    .hero-actions {
        display: flex;
        gap: 10px;
        margin-top: 4px;
    }
    .btn-red {
        flex: 1;
        padding: 12px;
        border-radius: 10px;
        background-color: var(--brand-red);
        color: #fff;
        font-size: 14px;
        font-weight: 700;
        transition: background-color 0.2s ease;
    }
    .btn-red:hover { background-color: var(--brand-red-dark); }

    .mini-list { display: grid; gap: 2px; }
    .mini-row {
        display: grid;
        grid-template-columns: 1fr auto auto;
        align-items: center;
        gap: 12px;
        padding: 14px 16px;
        border-radius: 12px;
        background-color: var(--bg-elevated);
        transition: background-color 0.2s ease;
    }
    .mini-row:hover { background-color: #2a2a2a; }
    .mini-name {
        display: flex; align-items: center; gap: 10px;
        font-size: 14px; font-weight: 600;
    }
    .mini-icon {
        width: 28px; height: 28px;
        border-radius: 8px;
        display: grid; place-items: center;
        font-size: 10px; font-weight: 800;
        background-color: #333; color: var(--text-muted);
    }
    .mini-price { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .mini-chg   { font-size: 12px; font-weight: 700; min-width: 58px; text-align: right; }
    .mini-chg.up   { color: var(--accent-green); }
    .mini-chg.down { color: var(--accent-red); }
</style>
</head>
<body>
<div class="app">

    <header class="top-bar">
        <a href="index.html" class="avatar">KB</a>
        <button class="ask-amy"><span class="sparkle">✦</span> Ask Amy</button>
        <div class="top-actions">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
            </svg>
            <div class="icon-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
                    <path d="M13.7 21a2 2 0 0 1-3.4 0"/>
                </svg>
                <span class="notif-badge">1</span>
            </div>
        </div>
    </header>

    <main class="content">

        <section>
            <h2 class="section-title">CFDs · Standard</h2>
            <div class="account-hero">
                <span class="label">Account balance</span>
                <div class="value">0.00 <span class="currency">USD</span></div>
                <div class="hero-actions">
                    <button class="btn-red">Deposit</button>
                </div>
            </div>
        </section>

        <section>
            <h2 class="section-title">Watchlist</h2>
            <div class="mini-list">
                <div class="mini-row">
                    <div class="mini-name"><span class="mini-icon">BTC</span> Bitcoin</div>
                    <div class="mini-price">$67,842.10</div>
                    <div class="mini-chg up">+2.41%</div>
                </div>
                <div class="mini-row">
                    <div class="mini-name"><span class="mini-icon">ETH</span> Ethereum</div>
                    <div class="mini-price">$3,412.55</div>
                    <div class="mini-chg up">+1.08%</div>
                </div>
                <div class="mini-row">
                    <div class="mini-name"><span class="mini-icon">NVDA</span> NVIDIA</div>
                    <div class="mini-price">$128.44</div>
                    <div class="mini-chg down">-0.62%</div>
                </div>
                <div class="mini-row">
                    <div class="mini-name"><span class="mini-icon">EUR</span> EUR/USD</div>
                    <div class="mini-price">1.0872</div>
                    <div class="mini-chg up">+0.14%</div>
                </div>
            </div>
        </section>

    </main>

    <nav class="bottom-nav">
        <a class="nav-item" href="dashboard.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <path d="M9 22V12h6v10"/>
            </svg>
            Home
        </a>
        <a class="nav-item active" href="cfds.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 3v18h18"/>
                <path d="m7 15 4-5 3 3 5-7"/>
            </svg>
            CFDs
        </a>
        <a class="nav-item" href="options.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="16" rx="2"/>
                <path d="M8 10h8M8 14h5"/>
            </svg>
            Options
        </a>
        <a class="nav-item" href="portfolio.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <path d="M9 3v18"/>
            </svg>
            Portfolio
        </a>
    </nav>

</div>
</body>
</html>
