<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>History — Mega Traders</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="app.css">
<style>
    .history-header {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 18px 20px 8px;
    }
    .back-btn {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background-color: var(--bg-elevated);
        display: grid;
        place-items: center;
        color: var(--text-main);
        transition: background-color 0.2s ease;
    }
    .back-btn:hover { background-color: #2e2e2e; }
    .history-header h1 {
        font-size: 20px;
        font-weight: 800;
        letter-spacing: -0.01em;
    }

    .filter-tabs {
        display: flex;
        gap: 6px;
        background-color: var(--bg-elevated);
        border-radius: 12px;
        padding: 4px;
    }
    .filter-tab {
        flex: 1;
        padding: 8px;
        text-align: center;
        font-size: 13px;
        font-weight: 700;
        color: var(--text-muted);
        border-radius: 9px;
        cursor: pointer;
        transition: background-color 0.15s ease, color 0.15s ease;
        border: none;
        background: transparent;
    }
    .filter-tab.active {
        background-color: #2a2a2a;
        color: var(--text-main);
    }

    .tx-list { display: grid; gap: 8px; }
    .tx-row {
        display: flex;
        align-items: center;
        gap: 12px;
        background-color: var(--bg-elevated);
        border-radius: 14px;
        padding: 14px 16px;
    }
    .tx-icon {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        flex-shrink: 0;
    }
    .tx-icon.deposit {
        background-color: rgba(74, 222, 128, 0.14);
        color: var(--accent-green);
    }
    .tx-icon.withdraw {
        background-color: rgba(255, 68, 79, 0.14);
        color: var(--brand-red);
    }
    .tx-body { flex: 1; min-width: 0; }
    .tx-title {
        font-size: 14px;
        font-weight: 700;
        color: var(--text-main);
    }
    .tx-sub {
        font-size: 12px;
        color: var(--text-muted);
        margin-top: 2px;
    }
    .tx-amount {
        font-size: 14px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        text-align: right;
    }
    .tx-amount.deposit { color: var(--accent-green); }
    .tx-amount.withdraw { color: var(--brand-red); }

    .empty-state {
        text-align: center;
        padding: 40px 20px;
        color: var(--text-muted);
    }
    .empty-state svg {
        margin: 0 auto 12px;
        color: var(--text-dim);
    }
    .empty-state p {
        font-size: 14px;
        line-height: 1.6;
    }
    .empty-state a {
        color: var(--brand-red);
        font-weight: 700;
        text-decoration: none;
    }
    .empty-state a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="app">

    <header class="history-header">
        <a href="dashboard.html" class="back-btn" aria-label="Back">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5"/><path d="m12 19-7-7 7-7"/>
            </svg>
        </a>
        <h1>History</h1>
    </header>

    <main class="content">

        <section>
            <div class="filter-tabs">
                <button class="filter-tab active" data-filter="all" type="button">All</button>
                <button class="filter-tab" data-filter="deposit" type="button">Deposits</button>
                <button class="filter-tab" data-filter="withdraw" type="button">Withdrawals</button>
            </div>
        </section>

        <section id="listSection">
            <div class="tx-list" id="txList"></div>
        </section>

        <section id="emptySection" style="display: none;">
            <div class="empty-state">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 8v4l3 2"/>
                    <circle cx="12" cy="12" r="9"/>
                </svg>
                <p>
                    No transactions yet.<br>
                    <a href="deposit.html">Make your first deposit →</a>
                </p>
            </div>
        </section>

    </main>

</div>

<script>
    function getTransactions() {
        try {
            return JSON.parse(localStorage.getItem('mt_transactions') || '[]');
        } catch (_) {
            return [];
        }
    }

    const allTransactions = getTransactions();

    const methodNames = {
        card: 'Debit / Credit card',
        crypto: 'Crypto',
        bank: 'Bank transfer'
    };

    function formatAmount(n) {
        return n.toLocaleString('en-US', {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });
    }

    function formatDate(iso) {
        const d = new Date(iso);
        const now = new Date();
        const sameDay = d.toDateString() === now.toDateString();

        const time = d.toLocaleTimeString('en-US', {
            hour: '2-digit',
            minute: '2-digit'
        });

        if (sameDay) return 'Today · ' + time;

        const yesterday = new Date(now);
        yesterday.setDate(yesterday.getDate() - 1);
        if (d.toDateString() === yesterday.toDateString()) {
            return 'Yesterday · ' + time;
        }

        return d.toLocaleDateString('en-US', {
            day: 'numeric',
            month: 'short',
            year: 'numeric'
        }) + ' · ' + time;
    }

    const txList      = document.getElementById('txList');
    const listSection = document.getElementById('listSection');
    const emptySec    = document.getElementById('emptySection');

    function render(filter) {
        let items = allTransactions;
        if (filter === 'deposit' || filter === 'withdraw') {
            items = allTransactions.filter(t => t.type === filter);
        }

        if (items.length === 0) {
            listSection.style.display = 'none';
            emptySec.style.display = 'block';
            return;
        }

        listSection.style.display = 'block';
        emptySec.style.display = 'none';

        txList.innerHTML = items.map(tx => {
            const isDeposit = tx.type === 'deposit';
            const sign = isDeposit ? '+' : '−';
            const label = isDeposit ? 'Deposit' : 'Withdrawal';
            const method = methodNames[tx.method] || tx.method || '';

            return `
                <div class="tx-row">
                    <div class="tx-icon ${tx.type}">
                        ${isDeposit
                            ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7 7 7-7"/></svg>'
                            : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="m5 12 7-7 7 7"/></svg>'
                        }
                    </div>
                    <div class="tx-body">
                        <div class="tx-title">${label}</div>
                        <div class="tx-sub">${formatDate(tx.date)}${method ? ' · ' + method : ''}</div>
                    </div>
                    <div class="tx-amount ${tx.type}">${sign}$${formatAmount(tx.amount)}</div>
                </div>
            `;
        }).join('');
    }

    const filterTabs = document.querySelectorAll('.filter-tab');
    filterTabs.forEach(tab => {
        tab.addEventListener('click', () => {
            filterTabs.forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            render(tab.dataset.filter);
        });
    });

    render('all');
</script>

</body>
</html>
